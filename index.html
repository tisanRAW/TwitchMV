<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Multiview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<script src="https://embed.twitch.tv/embed/v1.js"></script>
<style>
/* Layout: barra de controles arriba y, debajo, un tablero de 5 columnas fijas.
   Cada recuadro tiene una barra con su campo de texto (para cambiar de canal) y,
   debajo, el video en 16:9. Los reproductores nunca se mueven en el DOM: reordenar
   solo cambia coordenadas CSS, así que no se recarga ningún stream. */
:root {
  --bg: #0d0f14;
  --panel: #151821;
  --panel-2: #1c202b;
  --line: #2a2f3d;
  --fg: #e8eaf1;
  --muted: #98a0b3;
  --accent: #a99bff;
  --accent-ink: #15112e;
  --danger: #ff8080;
  --head: 34px;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--font-body);
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- barra superior ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  font: 600 16px/1 var(--font-display);
  letter-spacing: .01em;
  display: flex; align-items: center; gap: 8px;
  margin-right: 4px;
}
.brand i {
  width: 10px; height: 10px; border-radius: 2px; background: var(--accent);
  box-shadow: 14px 0 0 -2px var(--muted), 0 14px 0 -2px var(--muted);
  margin-right: 14px; margin-bottom: 14px;
}
.add { display: flex; flex: 1 1 280px; max-width: 520px; min-width: 0; gap: 6px; }
.field {
  flex: 1; min-width: 0; display: flex; align-items: center;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 0 10px;
}
.field:focus-within { border-color: var(--accent); }
.field span { color: var(--muted); white-space: nowrap; }
.field input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  padding: 9px 4px;
}
.field input::placeholder { color: #667089; }
.field input:disabled { cursor: not-allowed; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: #3b4254; background: #232837; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #bbb0ff; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; padding: 8px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; }

.notice {
  padding: 10px 12px; background: #2a2236; border-bottom: 1px solid var(--line);
  color: #d9d2f3; font-size: 13px;
}
.notice code {
  background: rgba(255,255,255,.08); border-radius: 4px; padding: 1px 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
}

.toast {
  position: fixed; z-index: 80; left: 50%; transform: translateX(-50%);
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  max-width: min(560px, calc(100vw - 32px));
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  font-size: 13px;
}
.toast.error { border-color: var(--danger); color: var(--danger); }

svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i circle { fill: currentColor; stroke: none; }

/* ---------- escenario y tablero ---------- */
.stage {
  flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden;
  display: flex; align-items: flex-start; justify-content: center;
}
.board {
  position: relative; flex: none;
  width: var(--bw, 100%); height: var(--bh, 100%);
  display: grid;
}

.tile {
  position: relative; min-width: 0; min-height: 0; margin: 3px;
  grid-column: var(--gc, auto); grid-row: var(--gr, auto);
  display: flex; flex-direction: column;
  container-type: inline-size;
  background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.tile.has-audio { border-color: var(--accent); }
.tile.flash { animation: flash .9s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* barra con el campo de texto de cada recuadro */
.head {
  flex: none; height: var(--head); display: flex; align-items: center; gap: 2px;
  padding: 0 4px 0 3px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.chan {
  flex: 1; min-width: 0; height: 26px; padding: 0 8px;
  background: transparent; border: 1px solid transparent; border-radius: 6px;
  font: 500 13px var(--font-display); color: var(--fg); text-overflow: ellipsis;
}
.chan:hover { border-color: var(--line); background: var(--bg); }
.chan:focus { outline: 0; border-color: var(--accent); background: var(--bg); }
.chan[readonly] { cursor: default; }
.chan[readonly]:hover { border-color: transparent; background: transparent; }
.head button {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  background: transparent; border: 0; border-radius: 6px; cursor: pointer; color: var(--muted);
}
.head button:hover { background: var(--panel-2); color: var(--fg); }
.head button[aria-pressed="true"] { color: var(--accent); }
.head button.remove:hover { color: var(--danger); }
body.locked .head [data-act="remove"], body.locked .head [data-act="focus"] { display: none; }
@container (max-width: 300px) { .head [data-act="focus"] { display: none; } }
@container (max-width: 240px) { .head [data-act="reload"] { display: none; } }

.video { position: relative; flex: 1; min-height: 0; background: #000; }
.mount, .mount iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ---------- modo edición ---------- */
.edit {
  position: absolute; inset: 0; z-index: 3;
  display: flex; flex-direction: column; gap: 8px; padding: 8px;
  background: rgba(10,12,18,.84);
}
.edit-top { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
.grip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2);
  cursor: grab; user-select: none; font-size: 12.5px;
}
.grip:active { cursor: grabbing; }
.mini {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 9px; cursor: pointer; font-size: 12.5px; white-space: nowrap;
}
.mini:hover { border-color: #3b4254; background: #232837; }
.edit-name {
  margin: auto; font: 600 clamp(14px, 1.8vw, 22px)/1.1 var(--font-display);
  text-align: center; overflow-wrap: anywhere;
}
.swap-here {
  position: absolute; inset: 0; z-index: 2; border: 0; cursor: pointer;
  background: rgba(169,155,255,.3); color: var(--fg);
  font: 600 15px var(--font-display);
}
.swap-here:hover { background: rgba(169,155,255,.5); }
.tile.picked { outline: 3px dashed var(--accent); outline-offset: -3px; }
.tile.drop { outline: 3px solid var(--accent); outline-offset: -3px; }
.tile.drop .edit { background: rgba(169,155,255,.35); }
.tile.dragging { opacity: .45; }

/* ---------- herramientas de fila ---------- */
.rowtools {
  position: absolute; inset: 0; z-index: 6;
  display: grid; grid-template-columns: minmax(0, 1fr); pointer-events: none;
}
.rowtool {
  grid-column: 1; pointer-events: auto; justify-self: start; align-self: center;
  margin-left: 10px; padding: 3px; margin-top: calc(var(--head) / 2);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 9px;
}
.rowtool button {
  width: 26px; height: 22px; display: grid; place-items: center;
  background: transparent; border: 0; border-radius: 6px; cursor: pointer;
}
.rowtool button:hover:not(:disabled) { background: var(--panel-2); color: var(--accent); }
.rowtool button:disabled { opacity: .3; cursor: not-allowed; }
.rgrip {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 3px 4px; cursor: grab; user-select: none; font-size: 11px; line-height: 1;
  border-radius: 6px;
}
.rgrip:hover { background: var(--panel-2); }
.rgrip:active { cursor: grabbing; }

/* ---------- pantalla vacía ---------- */
.empty {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
  gap: 14px; padding: 24px; text-align: center;
}
.empty h1 { margin: 0; font: 600 clamp(22px, 4vw, 32px)/1.15 var(--font-display); text-wrap: balance; }
.empty p { margin: 0; max-width: 50ch; color: var(--muted); text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- sugerencias del banco ---------- */
.suggest {
  position: fixed; z-index: 70; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
  box-shadow: 0 12px 36px rgba(0,0,0,.55); padding: 4px;
}
.sg-item {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
}
.sg-item.on, .sg-item:hover { background: var(--panel-2); }
.sg-item.off { opacity: .45; cursor: not-allowed; }
.sg-ch { font: 600 13px var(--font-display); }
.sg-sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-tag { color: var(--accent); font-size: 11px; white-space: nowrap; }
.sg-hint { padding: 8px; color: var(--muted); font-size: 12.5px; }

/* ---------- panel del banco ---------- */
.bankpanel {
  position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(380px, 100vw);
  display: flex; flex-direction: column; gap: 10px; padding: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -12px 0 36px rgba(0,0,0,.4);
}
.bp-head { display: flex; align-items: center; justify-content: space-between; font: 600 15px var(--font-display); }
.bp-head button { background: transparent; border: 0; cursor: pointer; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; }
.bp-head button:hover { background: var(--panel-2); }
.bp-info { color: var(--muted); font-size: 13px; }
.bp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.bp-search {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.bp-search:focus { outline: 0; border-color: var(--accent); }
.bp-groups { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-groups button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 11px; cursor: pointer; font-size: 12.5px;
}
.bp-groups button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.bp-groups button:disabled { opacity: .45; cursor: not-allowed; }
.bp-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.bp-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
}
.bp-row:hover { background: var(--panel-2); }
.bp-row .who { flex: 1; min-width: 0; }
.bp-row b { font: 600 13px var(--font-display); display: block; }
.bp-row small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bp-row .tag { color: var(--accent); font-size: 11px; }
.bp-empty { color: var(--muted); padding: 12px 4px; font-size: 13px; }

/* ---------- celular: todo en una columna ---------- */
@media (max-width: 720px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .stage { display: block; flex: none; overflow: visible; }
  .board {
    width: auto; height: auto; display: flex; flex-direction: column;
    padding-left: max(5px, env(safe-area-inset-left, 0px));
    padding-right: max(5px, env(safe-area-inset-right, 0px));
  }
  .tile { flex: none; }
  .video { flex: none; aspect-ratio: 16 / 9; }
  .empty { position: static; padding: 48px 8px; }
  .rowtools { display: none !important; }
  .tools { margin-left: 0; }
  #layout { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.flash { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><i aria-hidden="true"></i>Multiview</div>

    <form class="add" id="add-form" autocomplete="off">
      <label class="field" for="channel">
        <span>twitch.tv/</span>
        <input id="channel" type="text" placeholder="streamer y Enter (el espacio pone la coma)" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Canales de Twitch">
      </label>
      <button class="btn primary" type="submit" id="add-btn">Agregar</button>
    </form>

    <div class="tools">
      <span class="count" id="count" aria-live="polite"></span>
      <div class="seg" id="layout" role="group" aria-label="Disposición">
        <button type="button" data-mode="grid" aria-pressed="true">Grid</button>
        <button type="button" data-mode="focus" aria-pressed="false">Foco</button>
      </div>
      <button class="btn" type="button" id="edit" aria-pressed="false">Editar</button>
      <button class="btn" type="button" id="lock" aria-pressed="false">Bloquear</button>
      <button class="btn" type="button" id="bank-btn" aria-pressed="false">Banco</button>
      <button class="btn" type="button" id="playall">Reproducir todo</button>
      <button class="btn" type="button" id="copy">Copiar enlace</button>
      <button class="btn" type="button" id="clear">Quitar todo</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <main class="stage" id="stage" aria-label="Streams">
    <div class="empty" id="empty">
      <h1>Mirá varios streams a la vez</h1>
      <p>Escribí un canal de Twitch arriba y apretá Enter. Entran hasta 20, en filas de 5. Al apretar la barra espaciadora se pone la coma sola, así podés escribir varios nombres seguidos.</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="board" id="board" hidden>
      <div class="rowtools" id="rowtools" hidden></div>
    </div>
  </main>
</div>

<aside class="bankpanel" id="bankpanel" hidden aria-label="Banco de streamers">
  <div class="bp-head">
    <span>Banco de streamers</span>
    <button type="button" id="bp-close" aria-label="Cerrar el banco"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="bp-info" id="bp-info"></div>
  <div class="bp-actions">
    <button class="btn" type="button" id="bp-import">Importar Excel o CSV</button>
    <button class="btn" type="button" id="bp-reset" hidden>Volver al banco.xlsx del sitio</button>
    <input type="file" id="bankfile" accept=".xlsx,.xls,.ods,.csv" hidden>
  </div>
  <input class="bp-search" id="bp-search" type="search" placeholder="Buscar canal, nombre o grupo" aria-label="Buscar en el banco" autocomplete="off">
  <div class="bp-groups" id="bp-groups"></div>
  <div class="bp-list" id="bp-list"></div>
</aside>

<div class="suggest" id="suggest" role="listbox" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  'use strict';

  const MAX = 20;
  const COLS = 5;                       // ancho fijo del grid: 5 streams por fila
  const C = 360;                        // columnas finas, solo para el modo Foco
  const HEAD = 34;                      // alto de la barra con el campo de cada recuadro
  const SETTLE_MS = 90000;              // ventana en la que se reanudan pausas automáticas
  const EXAMPLES = ['ibai', 'auronplay', 'shroud', 'pokimane'];
  const KEY_LAYOUT = 'twitch-multiview:layout:v2';
  const KEY_PREFS = 'twitch-multiview:prefs:v2';
  const KEY_BANK = 'twitch-multiview:bank:v3';
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), board = $('board'), emptyEl = $('empty'), rowtools = $('rowtools'), toast = $('toast');
  const form = $('add-form'), input = $('channel');
  const btnEdit = $('edit'), btnLock = $('lock'), btnBank = $('bank-btn');
  const sg = $('suggest'), panel = $('bankpanel');

  /* ---------- estado ---------- */
  const tiles = new Map();   // uid -> { uid, name, el, player, ready, muted, offline, userPaused, retries, readyAt, retryTimer }
  let rows = [];             // filas del grid: [[uid, ...hasta 5], ...]
  let nextId = 1;
  let audio = null;          // uid del stream con sonido
  let focusUid = null;       // uid del stream grande en modo Foco
  let mode = 'grid';         // 'grid' | 'focus'
  let manual = false;        // true cuando el usuario acomodó a mano o bloqueó
  let locked = false;
  let editing = false;
  let picked = null;         // uid elegido para intercambiar con un clic
  let dragging = null;       // { kind: 'tile', uid } | { kind: 'row', index }
  let dropKey = '';
  let gesture = false;       // el usuario ya interactuó con la página
  let toastTimer = 0;
  let nextMountAt = 0;       // para escalonar la carga de reproductores

  let bank = [];             // [{ channel, name, group, notes, search }]
  let bankInfo = { kind: 'none', label: '' };
  let siteBankFound = false;

  /* Twitch solo reproduce dentro de páginas cuyo dominio figure como "parent". */
  const parents = (() => {
    const set = new Set();
    if (location.hostname) set.add(location.hostname);
    try { for (const o of (location.ancestorOrigins || [])) set.add(new URL(o).hostname); } catch (e) { /* ignorar */ }
    return [...set];
  })();

  const ICONS = {
    volume: '<svg class="i" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>',
    muted: '<svg class="i" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
    focus: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="16" rx="1.5"/><rect x="17.5" y="4" width="3.5" height="6.5" rx="1"/><rect x="17.5" y="13.5" width="3.5" height="6.5" rx="1"/></svg>',
    reload: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>',
    full: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    grip: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>',
    up: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
    lock: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    unlock: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-1.8"/></svg>'
  };

  /* ---------- utilidades ---------- */
  function setStatus(msg, isError) {
    clearTimeout(toastTimer);
    if (!msg) { toast.hidden = true; return; }
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
  }

  function parseChannel(raw) {
    let s = String(raw == null ? '' : raw).trim();
    const m = s.match(/twitch\.tv\/(?:popout\/)?([a-z0-9_]+)/i);
    if (m) s = m[1];
    s = s.replace(/^@/, '').toLowerCase();
    return /^[a-z0-9_]{2,25}$/.test(s) ? s : null;
  }

  const norm = (s) => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const flat = () => rows.flat();
  const nameOf = (uid) => tiles.get(uid).name;
  const findByName = (name) => [...tiles.values()].find((t) => t.name === name);
  const rowIndexOf = (uid) => rows.findIndex((r) => r.includes(uid));
  const editOn = () => editing && !locked && mode === 'grid';
  const activated = () => gesture || !!(navigator.userActivation && navigator.userActivation.hasBeenActive);

  function flash(t) {
    t.el.classList.remove('flash'); void t.el.offsetWidth; t.el.classList.add('flash');
  }

  /* Fila nueva cada 5 streams. */
  function reflow() {
    const list = flat();
    rows = [];
    for (let i = 0; i < list.length; i += COLS) rows.push(list.slice(i, i + COLS));
  }

  /* ---------- reproductores ---------- */
  function refreshTile(t) {
    const inp = t.el.querySelector('.chan');
    if (document.activeElement !== inp) inp.value = t.name;
    t.el.querySelector('.edit-name').textContent = t.name;
    inp.setAttribute('aria-label', 'Canal de este recuadro (' + t.name + '). Escribí otro y apretá Enter para cambiarlo');
    const set = (sel, label) => { const b = t.el.querySelector(sel); b.setAttribute('aria-label', label); b.title = label; };
    set('[data-act="audio"]', 'Sonido en ' + t.name);
    set('[data-act="focus"]', 'Mostrar ' + t.name + ' en grande');
    set('[data-act="reload"]', 'Recargar ' + t.name);
    set('[data-act="full"]', 'Pantalla completa de ' + t.name);
    set('.head [data-act="remove"]', 'Quitar ' + t.name);
  }

  function buildTile(t) {
    const el = document.createElement('article');
    el.className = 'tile';
    el.dataset.uid = t.uid;
    el.innerHTML =
      '<div class="head">' +
        '<input class="chan" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">' +
        '<button type="button" data-act="audio"></button>' +
        '<button type="button" data-act="focus">' + ICONS.focus + '</button>' +
        '<button type="button" data-act="reload">' + ICONS.reload + '</button>' +
        '<button type="button" data-act="full">' + ICONS.full + '</button>' +
        '<button type="button" class="remove" data-act="remove">' + ICONS.close + '</button>' +
      '</div>' +
      '<div class="video">' +
        '<div class="mount" id="p-' + t.uid + '"></div>' +
        '<div class="edit" hidden>' +
          '<div class="edit-top">' +
            '<span class="grip" draggable="true" title="Arrastrar para intercambiar de lugar">' + ICONS.grip + 'Arrastrar</span>' +
            '<button type="button" class="mini" data-act="pick">Mover</button>' +
          '</div>' +
          '<div class="edit-name"></div>' +
          '<button type="button" class="swap-here" data-act="swap" hidden>Intercambiar aquí</button>' +
        '</div>' +
      '</div>';
    t.el = el;
    board.appendChild(el);
    refreshTile(t);
  }

  /* Crea (o recrea) el reproductor de un recuadro. Recrearlo, en vez de usar setChannel,
     deja al recuadro limpio aunque el anterior haya quedado en negro o con error. */
  function mountPlayer(t) {
    if (!window.Twitch || !Twitch.Player || !tiles.has(t.uid)) return;
    const mount = t.el.querySelector('.mount');
    mount.textContent = '';
    clearTimeout(t.retryTimer);
    Object.assign(t, { ready: false, muted: true, offline: false, userPaused: false, retries: 0, readyAt: 0, retryTimer: 0 });

    /* Todos arrancan en mute: así el navegador siempre permite el autoplay.
       El sonido pasa al stream elegido apenas el usuario interactúa. */
    const player = new Twitch.Player(mount.id, {
      channel: t.name, parent: parents, width: '100%', height: '100%', autoplay: true, muted: true
    });
    t.player = player;
    const P = Twitch.Player;
    const mine = () => t.player === player;

    player.addEventListener(P.READY, () => {
      if (!mine()) return;
      t.ready = true;
      t.readyAt = Date.now();
      try { player.play(); } catch (e) { /* ignorar */ }
      applyAudio();
    });
    [P.PLAY, P.PLAYING].forEach((ev) => {
      if (ev) player.addEventListener(ev, () => { if (mine()) t.userPaused = false; });
    });
    if (P.PAUSE) {
      player.addEventListener(P.PAUSE, () => {
        if (!mine()) return;
        const f = mount.querySelector('iframe');
        if (f && document.activeElement === f) { t.userPaused = true; return; }   // pausa hecha por el usuario
        schedulePlay(t);
      });
    }
    if (P.OFFLINE) player.addEventListener(P.OFFLINE, () => { if (mine()) t.offline = true; });
    if (P.ONLINE) player.addEventListener(P.ONLINE, () => { if (mine()) { t.offline = false; schedulePlay(t, 600); } });
    if (P.PLAYBACK_BLOCKED) {
      player.addEventListener(P.PLAYBACK_BLOCKED, () => {
        if (!mine()) return;
        t.muted = true;
        try { player.setMuted(true); player.play(); } catch (e) { /* ignorar */ }
      });
    }
  }

  /* Los reproductores se crean de a uno, con una pausa corta entre cada uno.
     Crear 20 a la vez satura la red y el navegador, y algunos quedan pausados. */
  function queueMount(t) {
    const now = Date.now();
    const at = Math.max(now, nextMountAt);
    nextMountAt = at + 160;
    setTimeout(() => { if (tiles.has(t.uid)) mountPlayer(t); }, at - now);
  }

  /* Reanuda un stream que se pausó solo. Solo actúa durante los primeros 90 segundos
     de cada reproductor, y nunca si el usuario lo pausó desde los controles de Twitch. */
  function schedulePlay(t, delay) {
    if (t.retryTimer || !t.ready || t.offline || t.userPaused) return;
    if (Date.now() - t.readyAt > SETTLE_MS || t.retries >= 12) return;
    t.retryTimer = setTimeout(() => {
      t.retryTimer = 0;
      t.retries++;
      try { t.player.play(); } catch (e) { /* ignorar */ }
    }, delay || 600 + t.retries * 400);
  }

  function resumePaused(onlyWhileSettling) {
    tiles.forEach((t) => {
      if (!t.ready || t.offline || t.userPaused) return;
      if (onlyWhileSettling && Date.now() - t.readyAt > SETTLE_MS) return;
      try { if (t.player.isPaused()) t.player.play(); } catch (e) { /* ignorar */ }
    });
  }
  setInterval(() => resumePaused(true), 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resumePaused(false); });

  function addStream(name) {
    const dup = findByName(name);
    if (dup) { flash(dup); return 'dup'; }
    if (tiles.size >= MAX) return 'full';
    const t = { uid: 't' + (nextId++), name, el: null, player: null, ready: false, muted: true, offline: false, userPaused: false, retries: 0, readyAt: 0, retryTimer: 0 };
    tiles.set(t.uid, t);
    buildTile(t);
    queueMount(t);
    if (manual && rows.length) {
      const last = rows[rows.length - 1];
      if (last.length < COLS) last.push(t.uid); else rows.push([t.uid]);
    } else {
      rows.push([t.uid]);
    }
    if (!audio) audio = t.uid;
    return 'ok';
  }

  function removeStream(uid) {
    const t = tiles.get(uid);
    if (!t || locked) return;
    clearTimeout(t.retryTimer);
    rows = rows.map((r) => r.filter((u) => u !== uid)).filter((r) => r.length);
    tiles.delete(uid);
    t.el.remove();
    closeSuggest();
    if (audio === uid) audio = flat()[0] || null;
    if (focusUid === uid) focusUid = null;
    if (picked === uid) picked = null;
    if (!manual) reflow();
    if (!tiles.size) { manual = false; editing = false; mode = 'grid'; }
    render();
  }

  /* Cambia el canal de un recuadro sin tocar los demás. */
  function replaceChannel(uid, raw) {
    const t = tiles.get(uid);
    if (!t) return false;
    const inp = t.el.querySelector('.chan');
    const done = (ok) => { inp.value = t.name; return ok; };
    if (locked) return done(false);
    const name = parseChannel(raw);
    if (!name) { setStatus('"' + String(raw).trim() + '" no es un nombre de canal válido.', true); return done(false); }
    if (name === t.name) return done(true);
    const other = findByName(name);
    if (other) {
      flash(other);
      setStatus(name + ' ya está abierto en otro recuadro. Twitch no deja repetir un canal en la misma pantalla.', true);
      return done(false);
    }
    t.name = name;
    refreshTile(t);
    mountPlayer(t);
    render();
    setStatus('Ahora este recuadro muestra a ' + name + '.');
    return done(true);
  }

  function swapTiles(a, b) {
    if (locked || a === b) return;
    const ra = rowIndexOf(a), rb = rowIndexOf(b);
    if (ra < 0 || rb < 0) return;
    const ia = rows[ra].indexOf(a), ib = rows[rb].indexOf(b);
    rows[ra][ia] = b;
    rows[rb][ib] = a;
    manual = true;
    render();
  }

  function swapRows(i, j) {
    if (locked || i === j || i < 0 || j < 0 || i >= rows.length || j >= rows.length) return;
    [rows[i], rows[j]] = [rows[j], rows[i]];
    manual = true;
    render();
  }

  /* ---------- sonido ---------- */
  function applyAudio() {
    const can = activated();
    tiles.forEach((t) => {
      const on = t.uid === audio;
      const wantMuted = !(on && can);
      if (t.ready && t.muted !== wantMuted) {
        try {
          t.player.setMuted(wantMuted);
          t.muted = wantMuted;
          if (!wantMuted) t.player.play();
        } catch (e) { /* ignorar */ }
      }
      t.el.classList.toggle('has-audio', on);
      const b = t.el.querySelector('.head [data-act="audio"]');
      b.innerHTML = on ? ICONS.volume : ICONS.muted;
      b.setAttribute('aria-pressed', String(on));
    });
  }

  /* ---------- disposición ---------- */
  function layout() {
    const list = flat();
    const n = list.length;
    const focused = mode === 'focus' && n > 1;
    board.hidden = n === 0;

    if (focused) {
      if (!focusUid || !tiles.has(focusUid)) focusUid = (audio && tiles.has(audio)) ? audio : list[0];
      const side = Math.round(C * 0.22);
      board.style.gridTemplateColumns = 'repeat(' + C + ', minmax(0, 1fr))';
      board.style.gridTemplateRows = 'repeat(' + (n - 1) + ', minmax(0, 1fr))';
      let r = 1;
      list.forEach((uid) => {
        const el = tiles.get(uid).el;
        if (uid === focusUid) {
          el.style.setProperty('--gc', '1 / ' + (C - side + 1));
          el.style.setProperty('--gr', '1 / span ' + (n - 1));
        } else {
          el.style.setProperty('--gc', (C - side + 1) + ' / ' + (C + 1));
          el.style.setProperty('--gr', String(r++));
        }
      });
    } else {
      board.style.gridTemplateColumns = 'repeat(' + COLS + ', minmax(0, 1fr))';
      board.style.gridTemplateRows = 'repeat(' + Math.max(1, rows.length) + ', minmax(0, 1fr))';
      rows.forEach((row, ri) => {
        row.forEach((uid, i) => {
          const el = tiles.get(uid).el;
          el.style.setProperty('--gc', String(i + 1));
          el.style.setProperty('--gr', String(ri + 1));
        });
      });
    }
    list.forEach((uid, i) => { tiles.get(uid).el.style.order = String(i); });   // orden en celular
    tiles.forEach((t) => {
      t.el.querySelector('[data-act="focus"]').setAttribute('aria-pressed', String(focused && t.uid === focusUid));
    });
    fit();
  }

  /* Calcula el tamaño del tablero para que cada video sea 16:9 y entren las filas en pantalla. */
  function fit() {
    if (window.matchMedia('(max-width: 720px)').matches) {
      board.style.removeProperty('--bw'); board.style.removeProperty('--bh');
      return;
    }
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H || !tiles.size) return;
    if (mode === 'focus' && tiles.size > 1) {
      board.style.setProperty('--bw', W + 'px');
      board.style.setProperty('--bh', H + 'px');
      return;
    }
    const r = Math.max(1, rows.length);
    const chrome = HEAD + 8;                       // barra del recuadro + márgenes (6) + bordes (2)
    const byW = W / COLS;
    const byH = ((H / r) - chrome) * 16 / 9 + 8;
    const cw = Math.floor(Math.max(120, Math.min(byW, byH)));
    const ch = Math.round((cw - 8) * 9 / 16) + chrome;
    board.style.setProperty('--bw', (cw * COLS) + 'px');
    board.style.setProperty('--bh', (ch * r) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(stage);
  window.addEventListener('resize', fit);

  function renderRowTools() {
    rowtools.textContent = '';
    const show = editOn() && rows.length > 1;
    rowtools.hidden = !show;
    if (!show) return;
    rowtools.style.gridTemplateRows = 'repeat(' + rows.length + ', minmax(0, 1fr))';
    rows.forEach((row, ri) => {
      const d = document.createElement('div');
      d.className = 'rowtool';
      d.dataset.row = String(ri);
      d.style.gridRow = String(ri + 1);
      d.innerHTML =
        '<button type="button" data-rowact="up" title="Subir fila" aria-label="Subir fila ' + (ri + 1) + '"' + (ri === 0 ? ' disabled' : '') + '>' + ICONS.up + '</button>' +
        '<span class="rgrip" draggable="true" data-row="' + ri + '" title="Arrastrar para intercambiar filas">' + ICONS.grip + '<b>' + (ri + 1) + '</b></span>' +
        '<button type="button" data-rowact="down" title="Bajar fila" aria-label="Bajar fila ' + (ri + 1) + '"' + (ri === rows.length - 1 ? ' disabled' : '') + '>' + ICONS.down + '</button>';
      rowtools.appendChild(d);
    });
  }

  function applyUI() {
    const on = editOn();
    document.body.classList.toggle('editing', on);
    document.body.classList.toggle('locked', locked);
    tiles.forEach((t) => {
      t.el.querySelector('.edit').hidden = !on;
      t.el.querySelector('.swap-here').hidden = !(on && picked && picked !== t.uid);
      t.el.classList.toggle('picked', on && picked === t.uid);
      t.el.querySelector('[data-act="pick"]').textContent = (picked === t.uid) ? 'Cancelar' : 'Mover';
      t.el.querySelector('.chan').readOnly = locked;
    });
  }

  /* ---------- persistencia ---------- */
  function serialize() {
    if (!tiles.size) return '';
    if (manual) return rows.map((r) => r.map(nameOf).join(',')).join('/') + '/';
    return flat().map(nameOf).join(',');
  }

  function persist() {
    const s = serialize();
    try { history.replaceState(null, '', s ? '#' + s : location.pathname + location.search); } catch (e) { /* ignorar */ }
    try {
      localStorage.setItem(KEY_LAYOUT, s);
      localStorage.setItem(KEY_PREFS, JSON.stringify({ locked }));
    } catch (e) { /* ignorar */ }
  }

  /* ---------- render general ---------- */
  function render() {
    const n = tiles.size;
    if (locked) { editing = false; picked = null; }
    emptyEl.hidden = n > 0;
    $('count').textContent = n ? n + ' / ' + MAX : '';

    input.disabled = locked;
    $('add-btn').disabled = locked;
    input.placeholder = locked ? 'Layout bloqueado' : 'streamer y Enter (el espacio pone la coma)';
    $('clear').disabled = locked || !n;
    $('copy').disabled = !n;
    $('playall').disabled = !n;

    btnLock.disabled = !n;
    btnLock.setAttribute('aria-pressed', String(locked));
    btnLock.innerHTML = (locked ? ICONS.lock : ICONS.unlock) + (locked ? 'Bloqueado' : 'Bloquear');
    btnEdit.disabled = locked || !n;
    btnEdit.setAttribute('aria-pressed', String(editing && !locked));
    btnEdit.textContent = (editing && !locked) ? 'Listo' : 'Editar';
    $('layout').querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
      b.disabled = locked;
    });

    layout();
    renderRowTools();
    applyUI();
    applyAudio();
    persist();
    if (!panel.hidden) renderBank();
  }

  /* ---------- agregar canales ---------- */
  function submit(raw, opts) {
    if (locked) return;
    if (!window.Twitch || !Twitch.Player) {
      setStatus('No cargó el reproductor de Twitch. Revisá tu conexión y recargá la página.', true);
      return;
    }
    const tokens = String(raw).split(/[\s,]+/).filter(Boolean);
    if (!tokens.length) return;
    const added = [], dups = [], bad = [];
    let full = false;
    for (const tok of tokens) {
      const name = parseChannel(tok);
      if (!name) { bad.push(tok); continue; }
      const r = addStream(name);
      if (r === 'ok') added.push(name);
      else if (r === 'dup') dups.push(name);
      else full = true;
    }
    if (!manual) reflow();
    render();
    const notes = [];
    if (bad.length) notes.push('"' + bad.join('", "') + '" no es un nombre de canal válido');
    if (dups.length) notes.push(dups.join(', ') + ' ya está abierto');
    if (full) notes.push('El máximo es ' + MAX + ' streams');
    if (notes.length) setStatus(notes.join('. ') + '.', bad.length > 0 || full);
    if (!(opts && opts.keepInput) && (added.length || dups.length)) input.value = '';
    return added.length;
  }

  /* ---------- sugerencias del banco (campo de cada recuadro y campo principal) ---------- */
  const S = { input: null, getQuery: null, onPick: null, items: [], idx: -1 };

  function suggestEntries(q) {
    const nq = norm(q);
    let list = nq ? bank.filter((b) => b.search.includes(nq)) : bank.slice();
    if (nq) list.sort((a, b) => Number(b.channel.startsWith(nq)) - Number(a.channel.startsWith(nq)));
    return list.slice(0, 60);
  }

  function closeSuggest() {
    sg.hidden = true;
    S.input = null; S.items = []; S.idx = -1;
  }

  function renderSuggest() {
    if (!S.input) return;
    S.items = suggestEntries(S.getQuery());
    if (S.idx >= S.items.length) S.idx = -1;
    const open = new Set([...tiles.values()].map((t) => t.name));
    sg.textContent = '';
    if (!S.items.length) {
      const h = document.createElement('div');
      h.className = 'sg-hint';
      h.textContent = bank.length ? 'Ningún streamer del banco coincide.' : 'Todavía no hay banco. Abrí "Banco" para importar tu Excel.';
      sg.appendChild(h);
    }
    S.items.forEach((b, i) => {
      const d = document.createElement('div');
      d.className = 'sg-item' + (open.has(b.channel) ? ' off' : '') + (i === S.idx ? ' on' : '');
      d.dataset.i = String(i);
      d.setAttribute('role', 'option');
      const a = document.createElement('span'); a.className = 'sg-ch'; a.textContent = b.channel;
      const s = document.createElement('span'); s.className = 'sg-sub';
      s.textContent = open.has(b.channel) ? 'ya está en pantalla' : [b.name, b.notes].filter(Boolean).join(' · ');
      d.append(a, s);
      if (b.group) { const g = document.createElement('span'); g.className = 'sg-tag'; g.textContent = b.group; d.appendChild(g); }
      sg.appendChild(d);
    });

    const r = S.input.getBoundingClientRect();
    const w = Math.min(Math.max(r.width, 280), window.innerWidth - 16);
    const below = window.innerHeight - r.bottom - 10, above = r.top - 10;
    sg.style.width = w + 'px';
    sg.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - w)) + 'px';
    if (below >= 180 || below >= above) {
      sg.style.top = (r.bottom + 2) + 'px'; sg.style.bottom = 'auto';
      sg.style.maxHeight = Math.max(100, Math.min(320, below)) + 'px';
    } else {
      sg.style.bottom = (window.innerHeight - r.top + 2) + 'px'; sg.style.top = 'auto';
      sg.style.maxHeight = Math.max(100, Math.min(320, above)) + 'px';
    }
    sg.hidden = false;
    const on = sg.querySelector('.sg-item.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  function openSuggest(inp, getQuery, onPick) {
    S.input = inp; S.getQuery = getQuery; S.onPick = onPick; S.idx = -1;
    renderSuggest();
  }

  function pickSuggest(i) {
    const b = S.items[i];
    if (!b) return;
    if (tiles.size && [...tiles.values()].some((t) => t.name === b.channel)) {
      const t = findByName(b.channel); if (t) flash(t);
      return;
    }
    const cb = S.onPick;
    closeSuggest();
    cb(b);
  }

  /* Flechas, Enter y Escape para las sugerencias. Devuelve true si la tecla se usó. */
  function suggestKeys(e) {
    if (!S.input || sg.hidden) return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!S.items.length) return false;
      e.preventDefault();
      const open = new Set([...tiles.values()].map((t) => t.name));
      const dir = e.key === 'ArrowDown' ? 1 : -1;
      const len = S.items.length;
      let i = S.idx < 0 ? (dir > 0 ? -1 : 0) : S.idx;
      for (let k = 0; k < len; k++) {
        i = (i + dir + len) % len;
        if (!open.has(S.items[i].channel)) { S.idx = i; break; }
      }
      renderSuggest();
      return true;
    }
    if (e.key === 'Enter' && S.idx >= 0) { e.preventDefault(); pickSuggest(S.idx); return true; }
    return false;
  }

  sg.addEventListener('mousedown', (e) => e.preventDefault());   // no le saca el foco al campo
  sg.addEventListener('click', (e) => {
    const it = e.target.closest('.sg-item');
    if (!it || it.classList.contains('off')) return;
    pickSuggest(Number(it.dataset.i));
  });

  /* Campos de texto de cada recuadro */
  stage.addEventListener('focusin', (e) => {
    const inp = e.target.closest && e.target.closest('.chan');
    if (!inp || inp.readOnly) return;
    const uid = inp.closest('.tile').dataset.uid;
    inp.select();
    inp._touched = false;
    openSuggest(inp, () => (inp._touched ? inp.value : ''), (b) => { replaceChannel(uid, b.channel); inp.blur(); });
  });

  stage.addEventListener('input', (e) => {
    const inp = e.target.closest && e.target.closest('.chan');
    if (!inp || inp.readOnly) return;
    inp._touched = true;
    S.idx = -1;
    if (S.input !== inp) {
      const uid = inp.closest('.tile').dataset.uid;
      openSuggest(inp, () => (inp._touched ? inp.value : ''), (b) => { replaceChannel(uid, b.channel); inp.blur(); });
    } else renderSuggest();
  });

  stage.addEventListener('keydown', (e) => {
    const inp = e.target.closest && e.target.closest('.chan');
    if (!inp || inp.readOnly) return;
    const t = tiles.get(inp.closest('.tile').dataset.uid);
    if (suggestKeys(e)) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = inp.value;
      closeSuggest();
      replaceChannel(t.uid, v);
      inp.blur();
    } else if (e.key === 'Escape') {
      inp.value = t.name;
      closeSuggest();
      inp.blur();
    }
  });

  stage.addEventListener('focusout', (e) => {
    const inp = e.target.closest && e.target.closest('.chan');
    if (!inp) return;
    setTimeout(() => {
      if (document.activeElement === inp) return;
      if (S.input === inp) closeSuggest();
      const t = tiles.get(inp.closest('.tile') && inp.closest('.tile').dataset.uid);
      if (t) inp.value = t.name;
    }, 120);
  });

  /* Campo principal: el espacio escribe la coma, y sugiere desde el banco */
  const lastToken = () => input.value.split(/[\s,]+/).pop();
  const pickForMain = (b) => {
    const parts = input.value.split(/[\s,]+/).filter(Boolean);
    parts.pop();
    parts.push(b.channel);
    input.value = parts.join(', ') + ', ';
    input.focus();
  };

  input.addEventListener('input', (e) => {
    if (!String(e.inputType || '').startsWith('delete')) {
      const v = input.value, caret = input.selectionStart == null ? v.length : input.selectionStart;
      const fix = (s) => s.replace(/^[\s,]+/, '').replace(/[\s,]+/g, ', ');
      const nv = fix(v);
      if (nv !== v) {
        const nc = Math.min(fix(v.slice(0, caret)).length, nv.length);
        input.value = nv;
        try { input.setSelectionRange(nc, nc); } catch (err) { /* ignorar */ }
      }
    }
    if (S.input === input) { S.idx = -1; renderSuggest(); } else openSuggest(input, lastToken, pickForMain);
  });
  input.addEventListener('focus', () => { if (!booting && !input.disabled) openSuggest(input, lastToken, pickForMain); });
  input.addEventListener('keydown', (e) => {
    if (suggestKeys(e)) return;
    if (e.key === 'Escape') closeSuggest();
  });
  input.addEventListener('blur', () => setTimeout(() => { if (S.input === input && document.activeElement !== input) closeSuggest(); }, 120));

  form.addEventListener('submit', (e) => { e.preventDefault(); closeSuggest(); submit(input.value); });

  /* ---------- clics en el escenario ---------- */
  stage.addEventListener('click', (e) => {
    const rb = e.target.closest('[data-rowact]');
    if (rb) {
      const ri = Number(rb.closest('.rowtool').dataset.row);
      swapRows(ri, rb.dataset.rowact === 'up' ? ri - 1 : ri + 1);
      return;
    }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const tile = btn.closest('.tile');
    const uid = tile.dataset.uid;
    const t = tiles.get(uid);
    switch (btn.dataset.act) {
      case 'audio':
        audio = uid; applyAudio(); break;
      case 'remove':
        removeStream(uid); break;
      case 'reload':
        mountPlayer(t); setStatus('Recargando ' + t.name + '.'); break;
      case 'focus':
        if (locked) break;
        if (mode === 'focus' && focusUid === uid) mode = 'grid';
        else { mode = 'focus'; focusUid = uid; editing = false; picked = null; }
        render();
        break;
      case 'full': {
        const p = tile.requestFullscreen && tile.requestFullscreen();
        if (p && p.catch) p.catch(() => setStatus('La pantalla completa no está disponible acá. Usá el botón del reproductor.', true));
        break;
      }
      case 'pick':
        if (locked) break;
        picked = (picked === uid) ? null : uid;
        applyUI();
        if (picked) setStatus('Ahora tocá "Intercambiar aquí" en el stream con el que querés cambiarlo de lugar.');
        break;
      case 'swap':
        if (picked && picked !== uid) { const a = picked; picked = null; swapTiles(a, uid); }
        break;
      default: break;
    }
  });

  /* ---------- arrastrar y soltar ---------- */
  function dragTarget(e) {
    if (!dragging || !e.target.closest) return null;
    const tileEl = e.target.closest('.tile');
    const rtEl = e.target.closest('.rowtool');
    if (dragging.kind === 'tile') {
      if (tileEl && tileEl.dataset.uid !== dragging.uid) return { kind: 'tile', uid: tileEl.dataset.uid };
    } else {
      const ri = tileEl ? rowIndexOf(tileEl.dataset.uid) : rtEl ? Number(rtEl.dataset.row) : -1;
      if (ri >= 0 && ri !== dragging.index) return { kind: 'row', index: ri };
    }
    return null;
  }

  function clearDrop() {
    stage.querySelectorAll('.drop').forEach((el) => el.classList.remove('drop'));
    dropKey = '';
  }

  function endDrag() {
    dragging = null;
    clearDrop();
    stage.querySelectorAll('.dragging').forEach((el) => el.classList.remove('dragging'));
  }

  stage.addEventListener('dragstart', (e) => {
    if (locked) { e.preventDefault(); return; }
    const tg = e.target.closest && e.target.closest('.grip');
    const rg = e.target.closest && e.target.closest('.rgrip');
    if (tg) {
      const tile = tg.closest('.tile');
      dragging = { kind: 'tile', uid: tile.dataset.uid };
      try { e.dataTransfer.setDragImage(tile.querySelector('.edit'), 24, 24); } catch (err) { /* ignorar */ }
      setTimeout(() => tile.classList.add('dragging'), 0);
    } else if (rg) {
      dragging = { kind: 'row', index: Number(rg.dataset.row) };
    } else {
      return;
    }
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'multiview');
  });

  const onDragOver = (e) => {
    const t = dragTarget(e);
    if (!t) { if (dropKey) clearDrop(); return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const key = t.kind + ':' + (t.kind === 'tile' ? t.uid : t.index);
    if (key === dropKey) return;
    clearDrop();
    dropKey = key;
    if (t.kind === 'tile') tiles.get(t.uid).el.classList.add('drop');
    else rows[t.index].forEach((uid) => tiles.get(uid).el.classList.add('drop'));
  };
  stage.addEventListener('dragenter', onDragOver);
  stage.addEventListener('dragover', onDragOver);
  stage.addEventListener('dragleave', (e) => { if (!stage.contains(e.relatedTarget)) clearDrop(); });
  stage.addEventListener('drop', (e) => {
    const t = dragTarget(e);
    if (!t) return;
    e.preventDefault();
    const d = dragging;
    endDrag();
    if (t.kind === 'tile') swapTiles(d.uid, t.uid);
    else swapRows(d.index, t.index);
  });
  document.addEventListener('dragend', endDrag);

  /* ---------- barra superior ---------- */
  $('layout').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (!b || locked) return;
    mode = b.dataset.mode;
    if (mode === 'focus') { editing = false; picked = null; }
    if (mode === 'focus' && tiles.size < 2) setStatus('Agregá un segundo stream para usar el modo Foco.');
    render();
  });

  btnEdit.addEventListener('click', () => {
    if (locked) return;
    editing = !editing;
    picked = null;
    if (editing) mode = 'grid';
    render();
  });

  btnLock.addEventListener('click', () => {
    if (!tiles.size) return;
    locked = !locked;
    if (locked) { manual = true; editing = false; picked = null; endDrag(); closeSuggest(); }
    render();
    setStatus(locked ? 'Layout bloqueado: las posiciones y los canales quedan fijos.' : 'Layout desbloqueado.');
  });

  $('playall').addEventListener('click', () => {
    tiles.forEach((t) => { t.userPaused = false; try { t.player.play(); } catch (e) { /* ignorar */ } });
  });

  $('clear').addEventListener('click', () => {
    if (locked) return;
    tiles.forEach((t) => { clearTimeout(t.retryTimer); t.el.remove(); });
    tiles.clear();
    rows = []; audio = null; focusUid = null; picked = null;
    manual = false; editing = false; mode = 'grid';
    render();
  });

  $('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      setStatus('Enlace copiado. Quien lo abra ve los mismos streams en las mismas posiciones.');
    } catch (e) {
      setStatus('No se pudo copiar solo. El enlace está en la barra de direcciones.', true);
    }
  });

  document.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && tag !== 'INPUT' && !e.ctrlKey && !e.metaKey && !input.disabled) {
      e.preventDefault(); input.focus();
    }
    if (e.key === 'Escape') {
      if (picked) { picked = null; applyUI(); }
      else if (!panel.hidden && tag !== 'INPUT') toggleBank(false);
    }
  });

  /* El primer clic o tecla habilita el sonido del stream elegido. */
  ['pointerdown', 'keydown'].forEach((ev) => {
    window.addEventListener(ev, () => { if (!gesture) { gesture = true; applyAudio(); } }, true);
  });

  /* ---------- banco de streamers (Excel / CSV) ---------- */
  let xlsxPromise = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    if (!xlsxPromise) {
      xlsxPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = XLSX_URL;
        s.onload = () => resolve();
        s.onerror = () => { xlsxPromise = null; reject(new Error('xlsx')); };
        document.head.appendChild(s);
      });
    }
    return xlsxPromise;
  }

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [';', '\t', ','].map((d) => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const out = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); out.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    row.push(cell); out.push(row);
    return out;
  }

  /* Convierte filas de una planilla en entradas del banco. Busca las columnas por su encabezado:
     "Canal de Twitch", "Nombre", "Grupo", "Notas" y "Activo". Sin encabezados, la primera columna es el canal. */
  function rowsToBank(arr) {
    const data = arr.filter((r) => r.some((c) => String(c == null ? '' : c).trim() !== ''));
    if (!data.length) return [];
    const head = data[0].map(norm);
    const find = (keys, skip) => head.findIndex((h, i) => i !== skip && keys.some((k) => h.includes(k)));
    let ci = find(['canal', 'channel', 'twitch', 'login', 'usuario', 'user']);
    if (ci < 0) ci = find(['streamer']);
    let ni = -1, gi = -1, oi = -1, ai = -1, start = 1;
    if (ci < 0) {
      ci = 0; ni = 1; gi = 2; oi = 3;
      start = parseChannel(data[0][0]) ? 0 : 1;
    } else {
      ni = find(['nombre', 'name', 'alias'], ci);
      gi = find(['grupo', 'group', 'categoria', 'category', 'lista', 'equipo'], ci);
      oi = find(['nota', 'note', 'coment', 'descrip'], ci);
      ai = find(['activo', 'active', 'habilitado'], ci);
    }
    const cell = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
    const out = [], seen = new Set();
    for (let i = start; i < data.length; i++) {
      const r = data[i];
      const ch = parseChannel(r[ci]);
      if (!ch || seen.has(ch)) continue;
      if (ai >= 0 && ['no', 'n', '0', 'false', 'falso'].includes(norm(r[ai]))) continue;
      seen.add(ch);
      out.push({ channel: ch, name: cell(r, ni), group: cell(r, gi), notes: cell(r, oi) });
    }
    return out;
  }

  async function parseBank(buf, filename) {
    let arr;
    if (/\.csv$/i.test(filename)) {
      arr = parseCSV(new TextDecoder('utf-8').decode(buf));
    } else {
      await loadXlsx();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.SheetNames.find((s) => /banco|bank/i.test(s)) || wb.SheetNames[0];
      arr = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, defval: '', blankrows: false });
    }
    return rowsToBank(arr);
  }

  function setBank(entries, label, kind) {
    bank = entries.map((e) => ({ ...e, search: norm([e.channel, e.name, e.group, e.notes].join(' ')) }));
    bankInfo = { kind, label };
    btnBank.textContent = bank.length ? 'Banco (' + bank.length + ')' : 'Banco';
    if (!panel.hidden) renderBank();
    if (S.input) renderSuggest();
  }

  function saveBank(label, entries) {
    try { localStorage.setItem(KEY_BANK, JSON.stringify({ label, entries })); } catch (e) { /* ignorar */ }
  }

  /* Busca banco.xlsx (o banco.csv) junto a la página. Devuelve { file, entries } o null. */
  async function fetchSiteBank() {
    if (!/^https?:$/.test(location.protocol)) return null;
    for (const f of ['banco.xlsx', 'banco.csv']) {
      try {
        const res = await fetch(f, { cache: 'no-cache' });
        if (!res.ok || /text\/html/i.test(res.headers.get('content-type') || '')) continue;
        const entries = await parseBank(await res.arrayBuffer(), f);
        if (entries.length) { siteBankFound = true; return { file: f, entries }; }
      } catch (e) { /* probar el siguiente */ }
    }
    return null;
  }

  /* Al iniciar: un banco importado a mano tiene prioridad; si no hay, se usa el banco.xlsx del sitio. */
  async function loadBankAtStart() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY_BANK) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.entries && saved.entries.length) setBank(saved.entries, saved.label, 'import');
    const site = await fetchSiteBank();
    if (site && bankInfo.kind !== 'import') setBank(site.entries, site.file, 'site');
    else if (!panel.hidden) renderBank();
  }

  function addAll(channels) {
    if (locked) return;
    const n = submit(channels.join(','), { keepInput: true });
    if (n === 0 && channels.length) setStatus('Esos streamers ya están en pantalla o no hay lugar.', true);
  }

  function renderBank() {
    const open = new Set([...tiles.values()].map((t) => t.name));
    const info = $('bp-info');
    info.textContent = bank.length
      ? bank.length + ' streamers · ' + (bankInfo.kind === 'site' ? 'archivo ' + bankInfo.label + ' del sitio' : 'importado de ' + bankInfo.label)
      : 'Todavía no hay banco cargado. Importá tu Excel (hoja "Banco") o dejá un archivo banco.xlsx junto a esta página.';
    $('bp-reset').hidden = !(bankInfo.kind === 'import' && siteBankFound);

    const q = norm($('bp-search').value);
    const groups = new Map();
    bank.forEach((b) => { if (b.group) groups.set(b.group, (groups.get(b.group) || []).concat(b.channel)); });
    const gEl = $('bp-groups');
    gEl.textContent = '';
    groups.forEach((chs, g) => {
      const free = chs.filter((c) => !open.has(c)).length;
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.group = g;
      b.textContent = g + ' · ' + chs.length;
      b.title = 'Cargar el grupo ' + g;
      b.disabled = locked || free === 0 || tiles.size >= MAX;
      gEl.appendChild(b);
    });

    const list = $('bp-list');
    list.textContent = '';
    const shown = (q ? bank.filter((b) => b.search.includes(q)) : bank).slice(0, 300);
    if (!shown.length) {
      const d = document.createElement('div');
      d.className = 'bp-empty';
      d.textContent = bank.length ? 'Nada coincide con la búsqueda.' : '';
      list.appendChild(d);
    }
    shown.forEach((b) => {
      const row = document.createElement('div');
      row.className = 'bp-row';
      const who = document.createElement('div'); who.className = 'who';
      const bb = document.createElement('b'); bb.textContent = b.channel;
      const sm = document.createElement('small'); sm.textContent = [b.name, b.notes].filter(Boolean).join(' · ');
      who.append(bb, sm);
      row.appendChild(who);
      if (b.group) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = b.group; row.appendChild(tg); }
      const add = document.createElement('button');
      add.type = 'button'; add.className = 'mini'; add.dataset.bank = b.channel;
      const isOpen = open.has(b.channel);
      add.textContent = isOpen ? 'En pantalla' : 'Agregar';
      add.disabled = isOpen || locked || tiles.size >= MAX;
      row.appendChild(add);
      list.appendChild(row);
    });
  }

  function toggleBank(show) {
    panel.hidden = !show;
    btnBank.setAttribute('aria-pressed', String(show));
    if (show) renderBank();
  }

  btnBank.addEventListener('click', () => toggleBank(panel.hidden));
  $('bp-close').addEventListener('click', () => toggleBank(false));
  $('bp-search').addEventListener('input', renderBank);
  $('bp-import').addEventListener('click', () => $('bankfile').click());
  $('bp-list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-bank]');
    if (b) { addAll([b.dataset.bank]); renderBank(); }
  });
  $('bp-groups').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-group]');
    if (!b) return;
    const g = b.dataset.group;
    const chs = bank.filter((x) => x.group === g).map((x) => x.channel);
    const left = MAX - tiles.size;
    const open = new Set([...tiles.values()].map((t) => t.name));
    const toAdd = chs.filter((c) => !open.has(c));
    addAll(toAdd.slice(0, left));
    if (toAdd.length > left) setStatus('Se cargaron ' + left + ' de ' + toAdd.length + ' porque el máximo es ' + MAX + '.', true);
  });
  $('bankfile').addEventListener('change', async () => {
    const f = $('bankfile').files[0];
    if (!f) return;
    try {
      const entries = await parseBank(await f.arrayBuffer(), f.name);
      if (!entries.length) {
        setStatus('No encontré canales en ese archivo. Revisá que tenga una columna "Canal de Twitch".', true);
      } else {
        setBank(entries, f.name, 'import');
        saveBank(f.name, entries);
        setStatus('Banco cargado: ' + entries.length + ' streamers de ' + f.name + '.');
      }
    } catch (e) {
      setStatus('No pude leer el archivo. Para .xlsx hace falta conexión (se descarga el lector de Excel); también podés guardarlo como .csv.', true);
    }
    $('bankfile').value = '';
  });
  $('bp-reset').addEventListener('click', async () => {
    try { localStorage.removeItem(KEY_BANK); } catch (e) { /* ignorar */ }
    const site = await fetchSiteBank();
    if (site) setBank(site.entries, site.file, 'site'); else setBank([], '', 'none');
    setStatus(site ? 'Se volvió al banco del sitio.' : 'No se encontró banco.xlsx en el sitio.', !site);
  });

  /* ---------- arranque ---------- */
  EXAMPLES.forEach((n) => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = n;
    c.addEventListener('click', () => submit(n));
    $('chips').appendChild(c);
  });

  if (location.protocol === 'file:' || !location.hostname) {
    parents.push('localhost');
    const notice = $('notice');
    notice.hidden = false;
    notice.innerHTML = 'Twitch solo reproduce en páginas publicadas en la web. Subí esta carpeta a un hosting (por ejemplo Netlify Drop) o abrila desde un servidor local con <code>python3 -m http.server 8000</code>.';
  }

  let wasLocked = false;
  try { wasLocked = !!(JSON.parse(localStorage.getItem(KEY_PREFS) || '{}') || {}).locked; } catch (e) { /* ignorar */ }

  let saved = '';
  try { saved = decodeURIComponent(location.hash.slice(1)); } catch (e) { saved = location.hash.slice(1); }
  if (!saved) { try { saved = localStorage.getItem(KEY_LAYOUT) || ''; } catch (e) { saved = ''; } }

  const seen = new Set();
  const initialRows = saved.split('/')
    .map((part) => part.split(/[,\s]+/).map(parseChannel).filter((n) => {
      if (!n || seen.has(n) || seen.size >= MAX) return false;
      seen.add(n);
      return true;
    }))
    .filter((r) => r.length);

  if (initialRows.length) {
    if (window.Twitch && Twitch.Player) {
      manual = saved.includes('/');
      const built = [];
      initialRows.forEach((names) => {
        const row = [];
        names.forEach((name) => {
          if (addStream(name) === 'ok') row.push(findByName(name).uid);
        });
        if (row.length) built.push(row);
      });
      rows = built;                 // se respeta la estructura de filas guardada
      if (!manual) reflow();
      locked = wasLocked;
    } else {
      setStatus('No cargó el reproductor de Twitch. Revisá tu conexión y recargá la página.', true);
    }
  }

  let booting = true;
  render();
  if (!locked) input.focus();
  booting = false;
  loadBankAtStart();
})();
</script>
</body>
</html>
